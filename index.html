<style>
      
    .col {
      column-count: 2;
      column-gap: 40px; /* optionnel : espace entre les colonnes */
      list-style-type: disc; /* style des puces */
    }
    .in {
        display: inline-block;
        border: 1px solid red;
        margin: 10px;
    }
</style>


{% for category in site.data.docs %}
  <div>
	<p class="label">{{category[1].title}}</p>
	<ul class="col">
	{% for item in category[1].items %}
    <li>
	        <a href="{{category[1].url}}/{{item.slug}}">
   {{item.title}}</a>
    </li>
	{% endfor %}
	</ul>
	</div>
{% endfor %}
