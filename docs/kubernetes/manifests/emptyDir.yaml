apiVersion: v1
kind: Pod
metadata:
  name: emptydir-pod
spec:
  containers:
  - image: nginx:latest
    name: test-container
    volumeMounts:
    - mountPath: /data/bbc
      name: data-volume
  initContainers:
  - image: busybox:latest
    name: bbclog
    command:
    - sh
    - -c 
    - | 
      echo "HELLO" >> /data/bbc/test.log
    volumeMounts:
    - mountPath: /data/bbc
      name: data-volume
  volumes:
  - name: data-volume
    emptyDir:
      sizeLimit: 50Mi
