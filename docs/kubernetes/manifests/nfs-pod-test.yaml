apiVersion: v1
kind: Pod
metadata:
  name: app-using-nfs-2
spec:
  containers:
    - name: app
      image: busybox
      command: [ "sleep", "3600" ]
      volumeMounts:
        - mountPath: "/backup"
          name: nfs-volume

  volumes:
    - name: nfs-volume
      persistentVolumeClaim:
        claimName: nfs-claim