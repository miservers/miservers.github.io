---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-demo
spec:
  ingressClassName: istio-ingress-controller-demo
  rules:
  - host: "app2.safarit.local"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: web2-svc
            port:
              number: 80
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: web2
  name: web2
spec:
  containers:
  - image: nginx
    name: web2
---
apiVersion: v1
kind: Service
metadata:
  labels:
    run: web2
  name: web2-svc
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    run: web2